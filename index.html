<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="/manifest.json">

<link rel="apple-touch-icon" href="/icon-192.png">
<script>
  // Dunkelmodus vor dem ersten Rendern setzen (kein Aufblitzen)
  (function(){ var m = window.matchMedia('(prefers-color-scheme: dark)'); var set = function(){ document.documentElement.classList.toggle('dark', m.matches); }; set(); m.addEventListener && m.addEventListener('change', set); })();
</script>
</head>

<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
