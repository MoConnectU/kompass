<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A24" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kompass">
<title>Kompass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
/* Kompass – Seekarte & Logbuch */
:root{
  --paper:#EDF1F2; --sheet:#F8FAFA; --ink:#14283A; --mute:#5D7080; --rule:#C9D5DA; --rule2:#DFE7EA;
  --brass:#A87523; --brass-soft:#E9D9B8; --ok:#2E7D5B; --bad:#B4432F;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Schibsted Grotesk", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E1A24; --sheet:#132330; --ink:#E4ECF0; --mute:#8DA1AF; --rule:#2A4053; --rule2:#1D3141;
    --brass:#D7A64B; --brass-soft:#3A3220; --ok:#5DBB8E; --bad:#E2765F;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 32px}

/* Kopf: der Tag als Logbucheintrag */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.dateline{min-width:0}
.dateline .wd{font:500 14px/1.2 var(--sans);color:var(--mute);display:flex;align-items:center;gap:8px}
.dateline h1{font:600 30px/1.15 var(--serif);margin:4px 0 0;letter-spacing:-.2px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--rule);display:inline-block}
.sync.ok{background:var(--ok)}.sync.busy{background:var(--brass)}.sync.err{background:var(--bad)}
.nav{display:flex;gap:4px;flex:0 0 auto}
.nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);color:var(--mute);font-size:18px;line-height:1}
.nav button:hover{color:var(--ink);border-color:var(--ink)}
.nav .today{width:auto;padding:0 12px;border-radius:19px;font-size:14px}

/* Abschnitte */
section{margin-bottom:30px}
section > h2{font:600 19px/1.3 var(--serif);margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
section > h2 small{font:400 14px/1.3 var(--sans);color:var(--mute)}
.hint{color:var(--mute);font-size:14px;margin:2px 0 10px}

/* Eingabe */
.add{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:6px 6px 10px}
.add form{display:flex;gap:6px}
.add input[type=text]{flex:1;border:0;background:none;padding:10px 10px;font-size:17px;outline:none;min-width:0}
.add input::placeholder{color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:2px 8px 0}
.chip{padding:5px 11px 5px 9px;border-radius:999px;border:1px solid var(--rule);font-size:14px;display:inline-flex;align-items:center;gap:7px;color:var(--mute)}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--paper)}

/* Aufgabenliste */
ol.tasks,ul.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule2)}
.task:last-child{border-bottom:0}
.num{font:500 15px/1 var(--serif);color:var(--mute);width:22px;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 22px}
.pin{width:9px;height:9px;border-radius:50%;flex:0 0 9px;box-shadow:0 0 0 3px var(--paper)}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttitle{font:400 17px/1.35 var(--serif);overflow-wrap:anywhere}
.tmeta{font-size:13px;color:var(--mute);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tmeta .run{color:var(--brass);font-weight:600}
.task.done .ttitle{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--rule)}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);flex:0 0 26px;display:inline-flex;align-items:center;justify-content:center;color:var(--sheet);font-size:14px}
.chk:hover{border-color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.mv{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.mv button{width:30px;height:20px;border-radius:5px;color:var(--mute);font-size:12px;line-height:1}
.mv button:hover{background:var(--rule2);color:var(--ink)}
.empty{color:var(--mute);font-size:15px;padding:10px 0;font-style:italic;font-family:var(--serif)}

.later{border-top:1px dashed var(--rule);padding-top:14px}
.later summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;font:600 17px/1.3 var(--serif);color:var(--mute)}
.later summary::-webkit-details-marker{display:none}
.later[open] summary{color:var(--ink)}
.later summary small{font:400 14px var(--sans)}

/* Logbuch-Zeitleiste */
.log{list-style:none;margin:6px 0 0;padding:0 0 0 0;position:relative}
.log li{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:baseline;padding:7px 0 7px 18px;position:relative;font-size:15px}
.log li::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;background:var(--rule)}
.log li::after{content:"";position:absolute;left:0;top:14px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--rule))}
.log .tm{font-variant-numeric:tabular-nums;color:var(--mute)}
.log .lt{font-family:var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .du{font-variant-numeric:tabular-nums;color:var(--mute)}
.log li.now .tm,.log li.now .du{color:var(--brass);font-weight:600}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;border:1px solid var(--rule);font-weight:600;font-size:15px;background:var(--sheet)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme: dark){.btn.ok{color:#0E1A24}}
.btn.quiet{border-color:transparent;background:none;color:var(--mute);font-weight:500}
.btn.bad{color:var(--bad)}
.btn.sm{padding:6px 14px;font-size:14px}
.btn.block{width:100%}
.add .btn.pri{width:44px;height:44px;padding:0;font-size:22px;font-weight:400}

.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;margin-bottom:22px;border-left:3px solid var(--brass);background:var(--sheet);font-size:15px;border-radius:0 10px 10px 0}

input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:80px;font-family:var(--serif);line-height:1.6}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;color:var(--mute);margin-bottom:5px}

/* Fokus – der Kompass */
.focus{min-height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding-top:8px}
.fq{font-size:15px;color:var(--mute);display:inline-flex;gap:8px;align-items:center}
.ft{font:600 clamp(24px,6vw,32px)/1.25 var(--serif);max-width:22ch;margin:0;letter-spacing:-.2px}
.dial{position:relative;width:min(78vw,300px);aspect-ratio:1}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.dial .tick{stroke:var(--rule)}
.dial .tick.major{stroke:var(--mute)}
.dial .track{stroke:var(--rule2)}
.dial .prog{stroke:var(--brass);transition:stroke-dashoffset .9s linear}
.dial .needle{fill:var(--brass)}
.dial .north{fill:var(--ink)}
.dial .readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dial .clock{font:300 clamp(40px,12vw,54px)/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.dial .state{font-size:14px;color:var(--mute)}
.dial.run .clock{color:var(--brass)}
.facts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.focus textarea{max-width:480px;text-align:left}
@media (prefers-reduced-motion: reduce){.dial .prog{transition:none}}

/* Woche */
.sum{font:600 34px/1.15 var(--serif);margin:0}
.sum small{font:400 17px var(--sans);color:var(--mute)}
.bar{height:6px;background:var(--rule2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:999px}
.qrow{padding:12px 0;border-bottom:1px solid var(--rule2)}
.qrow:last-child{border-bottom:0}
.qrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qrow .name{font:500 17px var(--serif);display:inline-flex;align-items:center;gap:9px}
.qrow .val{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.days{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:10px;border-bottom:1px solid var(--rule);padding-bottom:0}
.days .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.days .stack{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;min-height:2px;background:var(--rule2)}
.days .stack i{display:block;width:100%}
.dl{display:flex;gap:8px;margin-top:6px}
.dl span{flex:1;text-align:center;font-size:13px;color:var(--mute)}
.dl span.today{color:var(--ink);font-weight:600}
.dv{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.prompt{font:500 16px/1.4 var(--serif);margin:0 0 6px}

/* Quests */
.quest{padding:18px 0;border-bottom:1px solid var(--rule)}
.quest:first-of-type{padding-top:6px}
.quest .qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.quest .qhead input{font:600 19px var(--serif);border:0;border-bottom:1px solid transparent;border-radius:0;background:none;padding:4px 0}
.quest .qhead input:focus{border-bottom-color:var(--ink)}
.palette{display:flex;gap:10px;flex-wrap:wrap}
.palette button{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.palette button.on{outline:2px solid var(--ink);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 130px;gap:12px}
.arch{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--mute)}

/* Navigation */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);z-index:5;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-around}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mute);padding:6px 16px;border-radius:10px;position:relative}
.tabbar button.on{color:var(--ink);font-weight:600}
.tabbar button.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:2px;background:var(--ink);border-radius:2px}
.tabbar svg{width:22px;height:22px}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);border-radius:18px 18px 0 0;width:100%;max-width:640px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{font:600 21px var(--serif);margin:0 0 16px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.area{font-weight:600}
.due{display:inline-block;font:600 12px/1 var(--sans);padding:4px 8px;border-radius:999px;background:var(--rule2);color:var(--mute)}
.due.soon{background:var(--brass-soft);color:var(--brass)}
.due.late{background:color-mix(in srgb, var(--bad) 16%, transparent);color:var(--bad)}
.addmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 8px 0}
.addmeta .lbl{font-size:13px;color:var(--mute);margin-right:2px}
.addmeta input[type=date]{width:auto;padding:5px 8px;font-size:14px;border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px;margin-bottom:6px}
.seg button{padding:6px 14px;border-radius:999px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:600}
.workcard{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--brass);border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:26px}
.workcard p{margin:4px 0 12px;color:var(--mute);font-size:15px}
.arow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule2);flex-wrap:wrap}
.arow input[type=text]{flex:1;min-width:120px;font:500 16px var(--serif);border:0;border-bottom:1px solid transparent;border-radius:0;background:none;padding:4px 0}
.arow input[type=text]:focus{border-bottom-color:var(--ink)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.three{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;white-space:nowrap}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:18px}.dateline h1{font-size:36px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabbar" id="tabs"></nav>
<div id="sheet"></div>

<script>
'use strict';
/* =========================================================
   Kompass – Daily Planning mit Quests, Fokus & Wochen-Review
   ========================================================= */
const LS_STATE = 'kompass-state-v1';
const LS_CODE  = 'kompass-sync-code';
const COLORS = ['#2F6DB0','#2E8B66','#C8553D','#D69B1A','#7556A8','#1E8C9A','#B4497C','#6A7B88'];
const OLD_COLORS = {'#7c9cff':'#2F6DB0','#4cc38a':'#2E8B66','#f2b84b':'#D69B1A','#ef6b6b':'#C8553D','#c084fc':'#7556A8','#2dd4bf':'#1E8C9A','#f472b6':'#B4497C','#94a3b8':'#6A7B88'};
const MAX_QUESTS = 3;
const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dk = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseDk = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseDk(s); d.setDate(d.getDate()+n); return dk(d); };
const todayKey = () => dk(new Date());
const mondayOf = s => { const d = parseDk(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return dk(d); };
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function fmtDur(ms){ if (ms > 0 && ms < 60000) return '< 1 min'; const m = Math.round(ms/60000); if (m < 60) return m + ' min'; return Math.floor(m/60) + ' h ' + pad(m%60); }
function fmtClock(ms){ const s = Math.floor(ms/1000); return (s>=3600 ? Math.floor(s/3600)+':' : '') + pad(Math.floor(s/60)%60) + ':' + pad(s%60); }
const hours = ms => (ms/3600000);
const fmtH = ms => { if (ms <= 0) return '0 h'; if (ms < 3600000) return Math.max(1, Math.round(ms/60000)) + ' min'; return hours(ms).toFixed(1).replace('.', ',') + ' h'; };
const fmtShort = ms => !ms ? '' : (ms < 3600000 ? Math.max(1, Math.round(ms/60000)) + 'm' : hours(ms).toFixed(1).replace('.', ','));
function dayLabel(s){
  const t = todayKey();
  if (s === t) return 'Heute';
  if (s === addDays(t,1)) return 'Morgen';
  if (s === addDays(t,-1)) return 'Gestern';
  const d = parseDk(s); return WD[(d.getDay()+6)%7] + ', ' + d.getDate() + '.' + (d.getMonth()+1) + '.';
}
function weekLabel(mon){ const a = parseDk(mon), b = parseDk(addDays(mon,6)); return a.getDate()+'.'+(a.getMonth()+1)+'. – '+b.getDate()+'.'+(b.getMonth()+1)+'.'; }
function toast(msg){ const el = document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(), 2200); }

/* ---------- State ---------- */
const emptyState = () => ({ quests:[], areas:[], tasks:[], sessions:[], reflections:{}, activeTimer:null, updatedAt:0 });
function loadState(){
  try { const s = JSON.parse(localStorage.getItem(LS_STATE)); if (s && Array.isArray(s.tasks)) return Object.assign(emptyState(), s); } catch(e){}
  return emptyState();
}
let S = loadState();
if (!Array.isArray(S.areas)) S.areas = [];
S.quests.forEach(q => { if (OLD_COLORS[q.color]) q.color = OLD_COLORS[q.color]; });
const ui = { view:'heute', day: todayKey(), week: mondayOf(todayKey()), openOther:false };

function saveLocal(){ try { localStorage.setItem(LS_STATE, JSON.stringify(S)); } catch(e){ toast('Speichern fehlgeschlagen'); } }
function commit(){ S.updatedAt = Date.now(); saveLocal(); schedulePush(); render(); }
function commitQuiet(){ S.updatedAt = Date.now(); saveLocal(); schedulePush(); }

const questById = id => S.quests.find(q => q.id === id);
const activeQuests = () => S.quests.filter(q => !q.archived);
const areaById = id => (S.areas||[]).find(a => a.id === id);
const activeAreas = () => (S.areas||[]).filter(a => !a.archived);
const daysBetween = (a,b) => Math.round((parseDk(b) - parseDk(a)) / 86400000);
const shortDate = s => { const d = parseDk(s); return d.getDate() + '.' + (d.getMonth()+1) + '.'; };
function dueChip(t){
  if (!t.due || t.done) return '';
  const d = daysBetween(todayKey(), t.due);
  if (d < 0) return `<span class="due late">überfällig seit ${shortDate(t.due)}</span>`;
  if (d === 0) return '<span class="due soon">Frist heute</span>';
  return `<span class="due ${d<=2?'soon':''}">Frist ${shortDate(t.due)}</span>`;
}
const isQuestTask = t => { const q = t.questId && questById(t.questId); return !!(q && !q.archived); };
const taskColor = t => { const q = t.questId && questById(t.questId); return q ? q.color : 'var(--rule)'; };

function spentMs(taskId){
  let ms = 0;
  for (const s of S.sessions) if (s.taskId === taskId) ms += s.end - s.start;
  if (S.activeTimer && S.activeTimer.taskId === taskId) ms += Date.now() - S.activeTimer.start;
  return ms;
}
function dayTasks(day){ return S.tasks.filter(t => t.date === day).sort((a,b) => a.order - b.order); }
function groups(day){
  const all = dayTasks(day);
  return {
    quest: all.filter(t => !t.done && isQuestTask(t)),
    other: all.filter(t => !t.done && !isQuestTask(t)),
    done:  all.filter(t => t.done).sort((a,b) => (a.doneAt||0) - (b.doneAt||0)),
  };
}
function focusQueue(){ const g = groups(todayKey()); return g.quest.concat(g.other); }
const nextOrder = day => Math.max(0, ...S.tasks.filter(t => t.date === day).map(t => t.order)) + 1;

/* ---------- Timer ---------- */
function stopTimer(){
  const a = S.activeTimer; if (!a) return;
  const end = Date.now();
  if (end - a.start >= 5000) {
    const t = S.tasks.find(x => x.id === a.taskId);
    S.sessions.push({ id:uid(), taskId:a.taskId, questId: t ? (t.questId||null) : null, areaId: t ? (t.areaId||null) : null, title: t ? t.title : '', start:a.start, end });
  }
  S.activeTimer = null;
}
function startTimer(taskId){ if (S.activeTimer) stopTimer(); S.activeTimer = { taskId, start: Date.now() }; }

/* ---------- Aktionen ---------- */
function addTask(title, questId, day, areaId, due){
  title = title.trim(); if (!title) return;
  S.tasks.push({ id:uid(), title, questId: questId || null, areaId: areaId || null, receivedAt: todayKey(), due: due || null, date: day, order: nextOrder(day), done:false, doneAt:null, notes:'' });
  commit();
}
function moveTask(id, dir){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const g = groups(t.date); const list = isQuestTask(t) ? g.quest : g.other;
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= list.length) return;
  const o = list[j].order; list[j].order = t.order; t.order = o; commit();
}
function toggleDone(id){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (!t.done && S.activeTimer && S.activeTimer.taskId === id) stopTimer();
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
  if (!t.done) t.order = nextOrder(t.date);
  commit();
}
function pullOverdue(){
  const t = todayKey();
  S.tasks.filter(x => !x.done && x.date < t).forEach(x => { x.date = t; x.order = nextOrder(t); });
  commit(); toast('Auf heute geholt');
}

function syncDot(){ return `<span class="sync ${syncState.code ? syncState.status : ''}" title="${esc(syncTitle())}"></span>`; }

  if (ui.view === 'heute'){
    const d = parseDk(ui.day);
    const rel = ui.day === t ? 'Heute' : ui.day === addDays(t,1) ? 'Morgen' : ui.day === addDays(t,-1) ? 'Gestern' : '';
    return `<header class="top"><div class="dateline"><div class="wd">${syncDot()}${rel ? rel + ', ' : ''}${WD_LONG[(d.getDay()+6)%7]}</div><h1>${longDate(ui.day)}</h1></div>

function taskRow(t, opts = {}){
  const running = S.activeTimer && S.activeTimer.taskId === t.id;
  const sp = spentMs(t.id);
  const meta = [];
  if (running) meta.push('<span class="run">Läuft</span>');
  if (sp > 0) meta.push(`<span class="live" data-task="${t.id}">${fmtDur(sp)}</span>`);
  if (t.notes) meta.push('<span>Mit Notiz</span>');
  const dc = dueChip(t); if (dc) meta.push(dc);
  const ar = t.areaId && areaById(t.areaId);
  return `<li class="task ${t.done?'done':''}">
    ${opts.num ? `<span class="num">${opts.num}</span>` : ''}
    <span class="pin" style="background:${taskColor(t)}"></span>
    <div class="tbody" data-act="edit" data-id="${t.id}"><div class="ttitle">${ar ? `<span class="area" style="color:${ar.color}">${esc(ar.name)}:</span> ` : ''}${esc(t.title)}</div>${meta.length?`<div class="tmeta">${meta.join('')}</div>`:''}</div>
    ${opts.sort ? `<div class="mv"><button data-act="up" data-id="${t.id}" aria-label="Nach oben">▲</button><button data-act="down" data-id="${t.id}" aria-label="Nach unten">▼</button></div>` : ''}
    <button class="chk ${t.done?'on':''}" data-act="done" data-id="${t.id}" aria-label="${t.done?'Wieder öffnen':'Erledigt'}">${t.done?'✓':''}</button>
  </li>`;
}

let addQuest = null, addArea = null;
function renderHeute(){
  const g = groups(ui.day);
  const t = todayKey();
  const overdue = S.tasks.filter(x => !x.done && x.date < t).length;
  const aq = activeQuests();
  if (addQuest && !aq.find(q => q.id === addQuest)) addQuest = null;
  const areas = activeAreas();
  if (addArea && !areas.find(a => a.id === addArea)) addArea = null;
  const otherOpen = ui.openOther || aq.length === 0;
  let h = '';
  if (ui.day === t && overdue) h += `<div class="banner"><span>${overdue} offene Aufgabe${overdue>1?'n':''} von früheren Tagen</span><button class="btn sm" data-act="overdue">Auf heute holen</button></div>`;

  h += `<section class="add"><form data-form="add"><input type="text" id="addInput" placeholder="Neue Aufgabe oder Anfrage" autocomplete="off" aria-label="Neue Aufgabe"><button class="btn pri" type="submit" aria-label="Aufgabe hinzufügen">+</button></form>
    <div class="chips">${aq.map(q => `<button class="chip ${addQuest===q.id?'on':''}" data-act="addq" data-id="${q.id}"><span class="pin" style="background:${q.color};box-shadow:none"></span>${esc(q.name)}</button>`).join('')}
    <button class="chip ${addQuest===null?'on':''}" data-act="addq" data-id="">Ohne Quest</button></div>
    ${areas.length ? `<div class="addmeta"><span class="lbl">Fachbereich</span>${areas.map(a => `<button class="chip ${addArea===a.id?'on':''}" data-act="adda" data-id="${a.id}"><span class="pin" style="background:${a.color};box-shadow:none"></span>${esc(a.name)}</button>`).join('')}</div>` : ''}
    <div class="addmeta"><label class="lbl" for="addDue">Frist</label><input type="date" id="addDue"></div></section>`;
  if (!aq.length) h += `<p class="hint">Unter Einrichten legst du mit einem Klick die Quests für die Arbeit an.</p>`;

  h += `<section style="margin-top:26px"><h2><span>Reihenfolge</span>${g.quest.length && ui.day===t ? '<button class="btn pri sm" data-act="tab" data-v="fokus">Fokus starten</button>' : ''}</h2>
    ${g.quest.length ? `<ol class="tasks">${g.quest.map((x,i) => taskRow(x,{sort:true,num:i+1})).join('')}</ol>` : '<p class="empty">Keine offenen Quest-Aufgaben.</p>'}</section>`;

  h += `<section><details class="later" ${otherOpen?'open':''}><summary data-act="toggleOther"><span>Später</span><small>${g.other.length} ohne Quest ${otherOpen?'▴':'▾'}</small></summary>
    ${g.other.length ? `<ul class="tasks" style="margin-top:6px">${g.other.map(x => taskRow(x,{sort:true})).join('')}</ul>` : '<p class="empty">Nichts offen.</p>'}</details></section>`;

  // Done-Liste
  const daySessions = S.sessions.filter(s => dk(new Date(s.start)) === ui.day).sort((a,b) => a.start - b.start);
  let questMs = 0, allMs = 0;
  for (const s of daySessions){ const d = s.end - s.start; allMs += d; if (sessionIsQuest(s)) questMs += d; }
  const live = S.activeTimer && dk(new Date(S.activeTimer.start)) === ui.day;
  if (live){
    const d = Date.now() - S.activeTimer.start; allMs += d;
    const at = S.tasks.find(x => x.id === S.activeTimer.taskId); if (at && isQuestTask(at)) questMs += d;
  }
  h += `<section><h2><span>Erledigt</span><small>${fmtH(questMs)} Quest-Zeit</small></h2>
    ${g.done.length ? `<ul class="tasks">${g.done.map(x => taskRow(x)).join('')}</ul>` : '<p class="empty">Noch nichts erledigt.</p>'}</section>`;

  // Logbuch
  let log = daySessions.map(s => {
    const t2 = S.tasks.find(x => x.id === s.taskId); const q = questById(s.questId);
    return `<li style="--c:${q ? q.color : 'var(--rule)'}"><span class="tm">${hm(s.start)}–${hm(s.end)}</span><span class="lt">${esc(t2 ? t2.title : s.title)}</span><span class="du">${fmtDur(s.end-s.start)}</span></li>`;
  }).join('');
  if (live){
    const at = S.tasks.find(x => x.id === S.activeTimer.taskId);
    log += `<li class="now" style="--c:var(--brass)"><span class="tm">${hm(S.activeTimer.start)}–jetzt</span><span class="lt">${esc(at?at.title:'')}</span><span class="du live" data-seg="1">${fmtDur(Date.now()-S.activeTimer.start)}</span></li>`;
  }
  h += `<section><h2><span>Logbuch</span><small>${fmtDur(allMs)} gearbeitet</small></h2>
    ${log ? `<ul class="log">${log}</ul>` : '<p class="empty">Hier erscheint deine echte Arbeitszeit, sobald du im Fokus den Timer startest.</p>'}</section>`;
  return h;
}
function sessionIsQuest(s){ return !!(s.questId && questById(s.questId)); }

/* Kompass-Ring: eine Umdrehung = 60 Minuten */
const DIAL_R = 130, DIAL_C = 2 * Math.PI * DIAL_R;
function dialSvg(ms){
  let ticks = '';
  for (let i = 0; i < 60; i++){
    const a = i * 6 * Math.PI / 180, major = i % 5 === 0;
    const r1 = 146, r2 = major ? 158 : 153;
    ticks += `<line class="tick ${major?'major':''}" x1="${(Math.sin(a)*r1).toFixed(1)}" y1="${(-Math.cos(a)*r1).toFixed(1)}" x2="${(Math.sin(a)*r2).toFixed(1)}" y2="${(-Math.cos(a)*r2).toFixed(1)}" stroke-width="${major?2:1}"/>`;
  }
  const frac = (ms % 3600000) / 3600000, ang = frac * 2 * Math.PI;
  return `<svg viewBox="-170 -170 340 340" aria-hidden="true">${ticks}
    <path class="north" d="M0 -168 L6 -160 L-6 -160 Z"/>
    <circle class="track" r="${DIAL_R}" fill="none" stroke-width="5"/>
    <circle class="prog" r="${DIAL_R}" fill="none" stroke-width="5" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="${DIAL_C.toFixed(1)}" stroke-dashoffset="${(DIAL_C*(1-frac)).toFixed(1)}"/>
    <circle class="needle" r="7" cx="${(Math.sin(ang)*DIAL_R).toFixed(1)}" cy="${(-Math.cos(ang)*DIAL_R).toFixed(1)}"/></svg>`;
}
function updateDial(el, ms){
  const frac = (ms % 3600000) / 3600000, ang = frac * 2 * Math.PI;
  const p = el.querySelector('.prog'), n = el.querySelector('.needle');
  if (p) p.setAttribute('stroke-dashoffset', (DIAL_C*(1-frac)).toFixed(1));
  if (n){ n.setAttribute('cx', (Math.sin(ang)*DIAL_R).toFixed(1)); n.setAttribute('cy', (-Math.cos(ang)*DIAL_R).toFixed(1)); }
}

function weekStats(mon){
  const days = Array.from({length:7}, (_,i) => addDays(mon,i));
  const per = {}, perArea = {}; const perDay = days.map(() => ({})); let quest = 0, all = 0;
  const add = (questId, start, ms, areaId) => {
    const di = days.indexOf(dk(new Date(start))); if (di < 0) return;
    all += ms;
    if (areaId) perArea[areaId] = (perArea[areaId]||0) + ms;
    const q = questId && questById(questId);
    if (q){ quest += ms; per[q.id] = (per[q.id]||0) + ms; perDay[di][q.id] = (perDay[di][q.id]||0) + ms; }
    else perDay[di]._ = (perDay[di]._||0) + ms;
  };
  for (const s of S.sessions){
    const areaId = s.areaId !== undefined ? s.areaId : (S.tasks.find(t => t.id === s.taskId) || {}).areaId;
    add(s.questId, s.start, s.end - s.start, areaId);
  }
  if (S.activeTimer){ const t = S.tasks.find(x => x.id === S.activeTimer.taskId); add(t ? t.questId : null, S.activeTimer.start, Date.now() - S.activeTimer.start, t ? t.areaId : null); }
  const doneTasks = S.tasks.filter(t => t.done && t.doneAt && days.includes(dk(new Date(t.doneAt))));
  return { days, per, perArea, perDay, quest, all, done: doneTasks.length, doneTasks };
}
function renderWoche(){
  const st = weekStats(ui.week);
  const qs = S.quests.filter(q => !q.archived || st.per[q.id]);
  const goal = activeQuests().reduce((a,q) => a + (Number(q.weeklyGoalH)||0), 0);
  const pct = goal ? Math.min(100, Math.max(st.quest ? 1.5 : 0, hours(st.quest)/goal*100)) : 0;
  const gl = String(goal).replace('.',',');
  const maxDay = Math.max(1, ...st.perDay.map(o => Object.values(o).reduce((a,b)=>a+b,0)));
  let h = `<section><p class="sum">${fmtH(st.quest)}${goal ? ` <small>von ${gl} h Quest-Zeit</small>` : ' <small>Quest-Zeit</small>'}</p>
    ${goal ? `<div class="bar"><i style="width:${pct}%;background:var(--ink)"></i></div>` : '<p class="hint">Gib deinen Quests ein Wochenziel in Stunden.</p>'}
    <p class="hint" style="margin-top:10px">${fmtH(st.all)} insgesamt gearbeitet, davon ${st.all ? Math.round(st.quest/st.all*100) : 0} % für Quests. ${st.done} Aufgabe${st.done===1?'':'n'} erledigt.</p></section>`;

  const mode = ui.weekMode || 'quest';
  h += `<div class="seg" role="tablist" aria-label="Auswertung"><button role="tab" aria-selected="${mode==='quest'}" class="${mode==='quest'?'on':''}" data-act="wmode" data-v="quest">Nach Quest</button><button role="tab" aria-selected="${mode==='area'}" class="${mode==='area'?'on':''}" data-act="wmode" data-v="area">Nach Fachbereich</button></div>`;
  if (mode === 'area'){
    const ids = Array.from(new Set([...Object.keys(st.perArea), ...st.doneTasks.filter(t => t.areaId).map(t => t.areaId)])).filter(id => areaById(id));
    ids.sort((a,b) => (st.perArea[b]||0) - (st.perArea[a]||0));
    const amax = Math.max(1, ...ids.map(id => st.perArea[id]||0));
    h += `<section>${ids.length ? ids.map(id => {
      const ar = areaById(id), ms = st.perArea[id]||0;
      const dn = st.doneTasks.filter(t => t.areaId === id).length, op = S.tasks.filter(t => !t.done && t.areaId === id).length;
      return `<div class="qrow"><div class="top"><span class="name"><span class="pin" style="background:${ar.color};box-shadow:none"></span>${esc(ar.name)}</span><span class="val">${fmtH(ms)}</span></div><div class="bar"><i style="width:${Math.max(ms?1.5:0, ms/amax*100)}%;background:${ar.color}"></i></div><p class="hint" style="margin:6px 0 0;font-size:13px">${dn} erledigt, ${op} offen</p></div>`;
    }).join('') : '<p class="empty">Noch keine Zeit für Fachbereiche erfasst. Wähle beim Anlegen einer Anfrage den Fachbereich aus.</p>'}</section>`;
  } else
  h += `<section>${qs.length ? qs.map(q => {
      const ms = st.per[q.id]||0, g = Number(q.weeklyGoalH)||0, p = g ? Math.min(100, Math.max(ms?1.5:0, hours(ms)/g*100)) : (ms?100:0);
      return `<div class="qrow"><div class="top"><span class="name"><span class="pin" style="background:${q.color};box-shadow:none"></span>${esc(q.name)}</span><span class="val">${fmtH(ms)}${g?` von ${String(g).replace('.',',')} h`:''}</span></div><div class="bar"><i style="width:${p}%;background:${q.color}"></i></div></div>`;
    }).join('') : '<p class="empty">Noch keine Quests.</p>'}</section>`;

  h += `<section><h2>Tage</h2><div class="days">${st.perDay.map(o => {
      const tot = Object.values(o).reduce((a,b)=>a+b,0);
      const segs = Object.entries(o).map(([k,ms]) => `<i style="height:${Math.max(2, ms/maxDay*100)}px;background:${k==='_'?'var(--rule)':(questById(k)||{}).color}"></i>`).join('');
      return `<div class="d"><span class="dv">${fmtShort(tot)}</span><div class="stack">${segs}</div></div>`;
    }).join('')}</div><div class="dl">${st.days.map((d,i) => `<span class="${d===todayKey()?'today':''}">${WD[i]}</span>`).join('')}</div></section>`;

  const hist = Array.from({length:8}, (_,i) => addDays(ui.week, -7*(7-i))).map(m => ({ m, q: weekStats(m).quest }));
  const maxH = Math.max(1, ...hist.map(x => x.q));
  h += `<section><h2>Letzte acht Wochen</h2><div class="days" style="height:96px">${hist.map(x => `<div class="d"><span class="dv">${fmtShort(x.q)}</span><div class="stack"><i style="height:${Math.max(2, x.q/maxH*64)}px;background:${x.m===ui.week?'var(--ink)':'var(--rule)'}"></i></div></div>`).join('')}</div>
    <div class="dl">${hist.map(x => `<span class="${x.m===ui.week?'today':''}">${parseDk(x.m).getDate()}.${parseDk(x.m).getMonth()+1}.</span>`).join('')}</div></section>`;

  const r = S.reflections[ui.week] || {};
  h += `<section><h2><span>Rückblick</span><small>${r.savedAt ? 'Gespeichert' : 'etwa 20 Minuten'}</small></h2>
    <div class="field"><p class="prompt">Was lief gut?</p><textarea data-refl="good">${esc(r.good)}</textarea></div>
    <div class="field"><p class="prompt">Was lief schlecht, und warum?</p><textarea data-refl="bad">${esc(r.bad)}</textarea></div>
    <div class="field"><p class="prompt">Was ändere ich nächste Woche konkret?</p><textarea data-refl="improve">${esc(r.improve)}</textarea></div>
    <div class="field"><p class="prompt">Passen meine Ziele und mein Alltag noch zusammen?</p><textarea data-refl="coherence">${esc(r.coherence)}</textarea></div>
    <p class="hint">Wird beim Tippen gespeichert.</p></section>`;
  return h;
}

function renderQuests(){
  const aq = activeQuests(), arch = S.quests.filter(q => q.archived);
  let h = '';
  if (!aq.some(q => q.name === 'Anfragen')) h += `<div class="workcard"><h2 style="font:600 19px/1.3 var(--serif);margin:0">Für die Arbeit einrichten</h2>
    <p>Legt zwei Quests an: „Anfragen“ für die Arbeit der Fachbereiche (25 h pro Woche) und „Optimierung“ für alles, was Abläufe dauerhaft vereinfacht (3 h pro Woche). Beides kannst du danach anpassen.</p>
    <button class="btn pri sm" data-act="qwork">Quests anlegen</button></div>`;
  h += `<section style="margin-bottom:6px"><h2>Quests <small>${aq.length} von ${MAX_QUESTS}</small></h2></section><p class="hint" style="margin-top:-8px;margin-bottom:8px">Höchstens drei große Ziele für dieses Quartal. Das Wochenziel misst Stunden, die du investierst, nicht das Ergebnis.</p>
    <section>${aq.map(q => `<div class="quest">
      <div class="qhead"><span class="pin" style="background:${q.color};box-shadow:none;width:12px;height:12px;flex-basis:12px"></span><input type="text" value="${esc(q.name)}" data-q="${q.id}" data-k="name" aria-label="Name der Quest"></div>
      <div class="two">
        <div class="field"><label>Woran merkst du, dass sie geschafft ist?</label><input type="text" value="${esc(q.goal||'')}" data-q="${q.id}" data-k="goal" placeholder="z. B. 10 Cafés als Kunden bis 31.3."></div>
        <div class="field"><label>Stunden pro Woche</label><input type="number" min="0" step="0.5" inputmode="decimal" value="${esc(q.weeklyGoalH ?? '')}" data-q="${q.id}" data-k="weeklyGoalH"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="palette" role="group" aria-label="Farbe">${COLORS.map(c => `<button style="background:${c}" class="${q.color===c?'on':''}" data-act="qcolor" data-id="${q.id}" data-c="${c}" aria-label="Farbe wählen"></button>`).join('')}</div>
        <button class="btn quiet sm" data-act="qarch" data-id="${q.id}">Archivieren</button>
      </div></div>`).join('')}
    <div style="margin-top:16px"><button class="btn ${aq.length?'':'pri'} block" data-act="qadd">Quest hinzufügen</button></div>
    ${aq.length >= MAX_QUESTS ? '<p class="hint" style="margin-top:10px">Mehr als drei Quests gleichzeitig verwässern den Fokus.</p>' : ''}</section>`;
  if (arch.length) h += `<section><h2>Archiv</h2>${arch.map(q => `<div class="arch"><span class="pin" style="background:${q.color};box-shadow:none"></span><span style="flex:1;font-family:var(--serif)">${esc(q.name)}</span><button class="btn quiet sm" data-act="qrestore" data-id="${q.id}">Reaktivieren</button></div>`).join('')}</section>`;

  const areas = activeAreas(), archA = (S.areas||[]).filter(a => a.archived);
  h += `<section><h2>Fachbereiche</h2>
    <p class="hint">Von wem kommen deine Anfragen? Der Fachbereich steht vor dem Titel, und in der Woche siehst du die Zeit pro Fachbereich.</p>
    ${areas.map(a => `<div class="arow"><span class="pin" style="background:${a.color};box-shadow:none"></span><input type="text" value="${esc(a.name)}" data-a="${a.id}" aria-label="Name des Fachbereichs">
      <div class="palette" role="group" aria-label="Farbe">${COLORS.map(c => `<button style="background:${c};width:22px;height:22px" class="${a.color===c?'on':''}" data-act="acolor" data-id="${a.id}" data-c="${c}" aria-label="Farbe wählen"></button>`).join('')}</div>
      <button class="btn quiet sm" data-act="aarch" data-id="${a.id}">Entfernen</button></div>`).join('')}
    <form data-form="area" style="display:flex;gap:8px;margin-top:12px"><input type="text" id="areaInput" placeholder="z. B. Vertrieb, Controlling, Marktfolge" autocomplete="off" aria-label="Neuer Fachbereich"><button class="btn" type="submit">Hinzufügen</button></form>
    ${archA.length ? `<p class="hint" style="margin-top:8px">Entfernt: ${archA.map(a => esc(a.name)).join(', ')}. <button class="btn quiet sm" data-act="arestore" style="padding:2px 6px">Wiederherstellen</button></p>` : ''}
  </section>`;
  h += `<section><h2>Sync zwischen Handy und PC</h2>
    <p class="hint">Gib auf allen Geräten denselben geheimen Code ein, mindestens 8 Zeichen. Wer den Code kennt, sieht deine Daten.</p>
    ${syncState.code
      ? `<p style="margin:0 0 10px">${syncDot()} ${esc(syncTitle())}</p><div class="btns"><button class="btn" data-act="syncnow">Jetzt synchronisieren</button><button class="btn quiet bad" data-act="syncoff">Trennen</button></div>`
      : `<form data-form="sync" style="display:flex;gap:8px"><input type="password" id="syncInput" placeholder="Sync-Code" autocomplete="off"><button class="btn pri" type="submit">Verbinden</button></form>`}
  </section>
  <section><h2>Daten</h2><p class="hint">Trage keine Kundennamen oder vertraulichen Inhalte ein. Formuliere Anfragen neutral.</p><div class="btns"><button class="btn" data-act="export">Backup exportieren</button><label class="btn" style="cursor:pointer">Backup importieren<input type="file" accept="application/json" id="importFile" style="display:none"></label></div></section>`;
  return h;
}

/* ---------- Bearbeiten-Sheet ---------- */
function openEdit(id){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const opts = `<option value="">Ohne Quest</option>` + S.quests.filter(q => !q.archived || q.id === t.questId).map(q => `<option value="${q.id}" ${q.id===t.questId?'selected':''}>${esc(q.name)}</option>`).join('');
  const aopts = `<option value="">Kein Fachbereich</option>` + (S.areas||[]).filter(a => !a.archived || a.id === t.areaId).map(a => `<option value="${a.id}" ${a.id===t.areaId?'selected':''}>${esc(a.name)}</option>`).join('');
  $('#sheet').innerHTML = `<div class="sheet-bg" data-act="closeSheet"><div class="sheet" data-stop role="dialog" aria-label="Aufgabe bearbeiten">
    <h3>Aufgabe bearbeiten</h3>
    <div class="field"><label>Titel</label><input type="text" id="eTitle" value="${esc(t.title)}"></div>
    <div class="two" style="grid-template-columns:1fr 1fr"><div class="field"><label>Quest</label><select id="eQuest">${opts}</select></div>
    <div class="field"><label>Fachbereich</label><select id="eArea">${aopts}</select></div></div>
    <div class="three"><div class="field"><label>Geplant für</label><input type="date" id="eDate" value="${t.date}"></div>
    <div class="field"><label>Eingang</label><input type="date" id="eRecv" value="${t.receivedAt||''}"></div>
    <div class="field"><label>Frist</label><input type="date" id="eDue" value="${t.due||''}"></div></div>
    <div class="field"><label>Notizen</label><textarea id="eNotes">${esc(t.notes)}</textarea></div>
    <p class="hint">Investierte Zeit: ${fmtDur(spentMs(t.id))}</p>
    <div class="btns">
      <button class="btn pri" data-act="eSave" data-id="${t.id}">Speichern</button>
      ${t.done ? '' : `<button class="btn" data-act="eTomorrow" data-id="${t.id}">Auf morgen</button><button class="btn" data-act="eFocus" data-id="${t.id}">Jetzt fokussieren</button>`}
      <button class="btn quiet bad" data-act="eDel" data-id="${t.id}">Löschen</button>
    </div></div></div>`;
}
const closeSheet = () => { $('#sheet').innerHTML = ''; };

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'closeSheet' && e.target.closest('[data-stop]')) return;
  if (act === 'toggleOther'){ e.preventDefault(); ui.openOther = !ui.openOther; render(); return; }
  switch (act){
    case 'tab': ui.view = el.dataset.v; if (ui.view === 'heute') ui.day = ui.day || todayKey(); render(); window.scrollTo(0,0); break;
    case 'day': { const v = +el.dataset.v; ui.day = v === 0 ? todayKey() : addDays(ui.day, v); render(); break; }
    case 'week': { const v = +el.dataset.v; ui.week = v === 0 ? mondayOf(todayKey()) : addDays(ui.week, 7*v); render(); break; }
    case 'adda': addArea = addArea === id ? null : id; render(); setTimeout(() => { const i = $('#addInput'); if (i) i.focus(); }, 0); break;
    case 'wmode': ui.weekMode = el.dataset.v; render(); break;
    case 'qwork': {
      const free = () => { const used = S.quests.filter(q => !q.archived).map(q => q.color); return COLORS.find(c => !used.includes(c)) || COLORS[0]; };
      if (!S.quests.some(q => !q.archived && q.name === 'Anfragen')) S.quests.push({ id:uid(), name:'Anfragen', goal:'Anfragen der Fachbereiche zuverlässig und zügig erledigen', weeklyGoalH:25, color: free(), archived:false });
      if (!S.quests.some(q => !q.archived && q.name === 'Optimierung')) S.quests.push({ id:uid(), name:'Optimierung', goal:'Wiederkehrende Anfragen vereinfachen, Abläufe dokumentieren', weeklyGoalH:3, color: free(), archived:false });
      commit(); toast('Quests für die Arbeit angelegt'); break;
    }
    case 'acolor': { const a = areaById(id); if (a){ a.color = el.dataset.c; commit(); } break; }
    case 'aarch': { const a = areaById(id); if (a){ a.archived = true; commit(); } break; }
    case 'arestore': S.areas.forEach(a => { a.archived = false; }); commit(); break;
    case 'addq': addQuest = id || null; render(); setTimeout(() => { const i = $('#addInput'); if (i) i.focus(); }, 0); break;
    case 'done': toggleDone(id); break;
    case 'up': moveTask(id, -1); break;
    case 'down': moveTask(id, 1); break;
    case 'edit': openEdit(id); break;
    case 'overdue': pullOverdue(); break;
    case 'start': startTimer(id); commit(); break;
    case 'pause': stopTimer(); commit(); break;
    case 'complete': {
      const wasRunning = !!S.activeTimer;
      const t = S.tasks.find(x => x.id === id);
      if (S.activeTimer && S.activeTimer.taskId === id) stopTimer();
      if (t){ t.done = true; t.doneAt = Date.now(); }
      const nxt = focusQueue()[0];
      if (wasRunning && nxt) startTimer(nxt.id);
      commit(); toast('Erledigt ✓'); break;
    }
    case 'skip': {
      const t = S.tasks.find(x => x.id === id); if (!t) break;
      const running = S.activeTimer && S.activeTimer.taskId === id;
      if (running) stopTimer();
      t.order = nextOrder(t.date);
      const nxt = focusQueue()[0];
      if (running && nxt) startTimer(nxt.id);
      commit(); break;
    }
    case 'closeSheet': closeSheet(); break;
    case 'eSave': case 'eTomorrow': case 'eFocus': {
      const t = S.tasks.find(x => x.id === id); if (!t) break;
      const newDate = act === 'eTomorrow' ? addDays(todayKey(), 1) : ($('#eDate').value || t.date);
      if (newDate !== t.date){ t.date = newDate; t.order = nextOrder(newDate); }
      t.title = $('#eTitle').value.trim() || t.title;
      t.questId = $('#eQuest').value || null;
      t.areaId = $('#eArea').value || null;
      t.receivedAt = $('#eRecv').value || null;
      t.due = $('#eDue').value || null;
      t.notes = $('#eNotes').value;
      if (act === 'eFocus'){
        t.date = todayKey(); t.order = Math.min(0, ...S.tasks.filter(x => x.date === t.date).map(x => x.order)) - 1;
        startTimer(t.id); ui.view = 'fokus';
      }
      closeSheet(); commit(); break;
    }
    case 'eDel': {
      if (!confirm('Aufgabe löschen? Die erfasste Zeit bleibt im Logbuch.')) break;
      if (S.activeTimer && S.activeTimer.taskId === id) stopTimer();
      S.tasks = S.tasks.filter(x => x.id !== id); closeSheet(); commit(); break;
    }
    case 'qadd': {
      const used = S.quests.filter(q => !q.archived).map(q => q.color);
      S.quests.push({ id:uid(), name:'Neue Quest', goal:'', weeklyGoalH:5, color: COLORS.find(c => !used.includes(c)) || COLORS[0], archived:false });
      commit(); break;
    }
    case 'qcolor': { const q = questById(id); if (q){ q.color = el.dataset.c; commit(); } break; }
    case 'qarch': { const q = questById(id); if (q && confirm(`„${q.name}“ archivieren? Aufgaben bleiben erhalten.`)){ q.archived = true; commit(); } break; }
    case 'qrestore': { const q = questById(id); if (q){ q.archived = false; commit(); } break; }
    case 'syncnow': syncNow(true); break;
    case 'syncoff': if (confirm('Sync auf diesem Gerät trennen? Daten bleiben lokal erhalten.')){ localStorage.removeItem(LS_CODE); syncState.code = null; syncState.id = null; render(); } break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kompass-backup-' + todayKey() + '.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000); break;
    }
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'add'){
    const v = $('#addInput').value;
    const due = ($('#addDue') || {}).value || null;
    if (v.trim() && !addQuest){ ui.openOther = true; if (activeQuests().length) toast('Unter „Später“ abgelegt'); }
    const area = addArea; if (v.trim()) addArea = null;
    addTask(v, addQuest, ui.day, area, due);
    setTimeout(() => { const i = $('#addInput'); if (i) i.focus(); }, 0);
  } else if (f.dataset.form === 'area'){
    const name = $('#areaInput').value.trim(); if (!name) return;
    const used = activeAreas().map(a => a.color).concat(activeQuests().map(q => q.color));
    S.areas.push({ id:uid(), name, color: COLORS.find(c => !used.includes(c)) || COLORS[S.areas.length % COLORS.length], archived:false });
    commit(); setTimeout(() => { const i = $('#areaInput'); if (i) i.focus(); }, 0);
  } else if (f.dataset.form === 'sync'){
    const code = $('#syncInput').value.trim();
    if (code.length < 8){ toast('Mindestens 8 Zeichen'); return; }
    connectSync(code);
  }
});

let typingTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.notes){
    const task = S.tasks.find(x => x.id === t.dataset.notes); if (task){ task.notes = t.value; clearTimeout(typingTimer); typingTimer = setTimeout(commitQuiet, 500); }
  } else if (t.dataset.refl){
    const r = S.reflections[ui.week] = S.reflections[ui.week] || {};
    r[t.dataset.refl] = t.value; r.savedAt = Date.now();
    clearTimeout(typingTimer); typingTimer = setTimeout(commitQuiet, 500);
  } else if (t.dataset.a){
    const a = areaById(t.dataset.a); if (!a) return;
    a.name = t.value; clearTimeout(typingTimer); typingTimer = setTimeout(commitQuiet, 500);
  } else if (t.dataset.q){
    const q = questById(t.dataset.q); if (!q) return;
    q[t.dataset.k] = t.dataset.k === 'weeklyGoalH' ? (t.value === '' ? '' : Number(t.value)) : t.value;
    clearTimeout(typingTimer); typingTimer = setTimeout(commitQuiet, 500);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'importFile' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try {
        const s = JSON.parse(r.result);
        if (!s || !Array.isArray(s.tasks)) throw 0;
        if (!confirm('Aktuelle Daten durch das Backup ersetzen?')) return;
        S = Object.assign(emptyState(), s); commit(); toast('Backup importiert');
      } catch(_) { toast('Datei ist kein gültiges Backup'); }
    };
    r.readAsText(e.target.files[0]);
  }
});

// Live-Timer aktualisieren, ohne neu zu rendern (Eingaben bleiben erhalten)
setInterval(() => {
  if (!S.activeTimer) return;
  document.querySelectorAll('.live-clock').forEach(el => { el.textContent = fmtClock(spentMs(el.dataset.task)); });
  document.querySelectorAll('[data-dial]').forEach(el => updateDial(el, spentMs(el.dataset.dial)));
  document.querySelectorAll('.live').forEach(el => {
    el.textContent = el.dataset.seg ? fmtDur(Date.now() - S.activeTimer.start) : fmtDur(spentMs(el.dataset.task));
  });
}, 1000);

// Tageswechsel erkennen
let lastToday = todayKey();
setInterval(() => { const t = todayKey(); if (t !== lastToday){ if (ui.day === lastToday) ui.day = t; lastToday = t; ui.week = mondayOf(t); render(); } }, 30000);

/* ---------- Sync ---------- */
const syncState = { code: localStorage.getItem(LS_CODE), id: null, status: 'ok', error: '', lastSync: 0 };
function syncTitle(){
  if (!syncState.code) return 'Nur auf diesem Gerät';
  if (syncState.status === 'busy') return 'Synchronisiere…';
  if (syncState.status === 'err') return 'Sync-Fehler: ' + syncState.error;
  return syncState.lastSync ? 'Synchron (' + hm(syncState.lastSync) + ')' : 'Verbunden';
}
function setSync(status, error = ''){
  syncState.status = status; syncState.error = error;
  const d = document.querySelector('.sync'); if (d){ d.className = 'sync ' + (syncState.code ? status : ''); d.title = syncTitle(); }
}
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kompass|' + str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function getId(){ if (!syncState.id && syncState.code) syncState.id = await sha256(syncState.code); return syncState.id; }

async function pull(){
  const id = await getId(); if (!id) return;
  setSync('busy');
  const r = await fetch('/api/sync?id=' + id, { cache:'no-store' });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  if (j.state && (j.state.updatedAt||0) > (S.updatedAt||0)){
    S = Object.assign(emptyState(), j.state); saveLocal(); render();
  }
  syncState.lastSync = Date.now(); setSync('ok');
  return j.state;
}
let pushTimer = null, pushing = false;
function schedulePush(){ if (!syncState.code) return; clearTimeout(pushTimer); setSync('busy'); pushTimer = setTimeout(push, 1200); }
async function push(){
  const id = await getId(); if (!id) return;
  if (pushing){ schedulePush(); return; }
  pushing = true;
  try {
    const r = await fetch('/api/sync', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, state: S }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    if (j.conflict && j.state){ S = Object.assign(emptyState(), j.state); saveLocal(); render(); toast('Neuerer Stand vom anderen Gerät geladen'); }
    syncState.lastSync = Date.now(); setSync('ok');
  } catch(e){ setSync('err', navigator.onLine ? String(e.message||e) : 'offline'); }
  finally { pushing = false; }
}
async function syncNow(manual){
  if (!syncState.code) return;
  try {
    await pull();
    await push();
    if (manual) toast('Synchronisiert');
  } catch(e){ setSync('err', navigator.onLine ? String(e.message||e) : 'offline'); if (manual) toast('Sync fehlgeschlagen'); }
}
async function connectSync(code){
  syncState.code = code; syncState.id = null;
  try {
    const remote = await pull();
    localStorage.setItem(LS_CODE, code);
    if (!remote || (remote.updatedAt||0) <= (S.updatedAt||0)) await push();
    toast(remote ? 'Verbunden – Daten geladen' : 'Verbunden – neuer Sync-Bereich angelegt');
    render();
  } catch(e){
    syncState.code = null; syncState.id = null; setSync('ok');
    toast('Verbindung fehlgeschlagen: ' + (e.message || e));
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(false); });
window.addEventListener('online', () => syncNow(false));
setInterval(() => { if (document.visibilityState === 'visible' && !pushing && syncState.status !== 'busy') syncNow(false); }, 60000);

/* ---------- Start ---------- */
render();
if (syncState.code) syncNow(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
